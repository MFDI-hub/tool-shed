site_name: "tools-shed"
site_description: "Portable C CLI tools, built for every platform."
# Canonical URL for the sitemap. docs.yml publishes a GitHub Pages project site.
# For Read the Docs, use https://tool-shed.readthedocs.io/ instead.
site_url: https://MFDI-hub.github.io/tool-shed/

repo_url: https://github.com/MFDI-hub/tool-shed
repo_name: MFDI-hub/tool-shed
edit_uri: edit/main/docs/

theme:
  name: material
  features:
    - content.code.copy
    - navigation.sections
    - search.suggest

plugins:
  - search
  - git-revision-date-localized:
      enable_creation_date: true
      fallback_to_build_date: true
  # Pulls docstrings straight out of the package. Use it in a page with:
  #   ::: tools_shed
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          # RTD never installs the project. This lets mkdocstrings import it from src/.
          paths: [src]
          options:
            show_source: false
            show_root_heading: true
            docstring_style: google
            separate_signature: true
            merge_init_into_class: true

markdown_extensions:
  - pymdownx.snippets:
      base_path: ["."]
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - admonition
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Installation: installation.md
  - Tools:
      - Overview: tools/index.md
      - sync_chosen_files: tools/sync_chosen_files.md
      - watch_run: tools/watch_run.md
      - skeleton_dump: tools/skeleton_dump.md
      - hash_tree: tools/hash_tree.md
      - repo_map: tools/repo_map.md
      - related: tools/related.md
      - quiet_exec: tools/quiet_exec.md
      - slice: tools/slice.md
      - churn: tools/churn.md
      - diff_syms: tools/diff_syms.md
  - API Reference: api.md
  - Development: development.md
  - Publishing: publishing.md
