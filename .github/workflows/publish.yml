name: Publish to PyPI

on:
  release:
    types: [published]
  # Re-run from a vX.Y.Z tag. A branch dispatch has no release tag, so
  # uv-dynamic-versioning emits a local version that PyPI rejects.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (official GitHub action)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install uv (official Astral action)
        uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.13.8"
          enable-cache: false
          python-version: "3.13"

      - name: Install Zig
        uses: mlugg/setup-zig@v2.2.1
        with:
          version: "0.17.1"

      - name: Install all dependencies
        run: uv sync --locked --all-extras

      - name: Build every native target
        run: uv run python scripts/build_native.py --all

      - name: Run tests
        run: uv run pytest -n auto --cov --cov-report=term-missing

      - name: Package platform wheels
        run: uv run python scripts/package_wheels.py --assets-dir dist/release-assets

      - name: Upload wheels
        uses: actions/upload-artifact@v7
        with:
          name: wheels
          path: dist/*.whl
          if-no-files-found: error

      - name: Upload binaries
        uses: actions/upload-artifact@v7
        with:
          name: binaries
          path: dist/release-assets/*
          if-no-files-found: error

  github-assets:
    needs: build
    if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download wheels
        uses: actions/download-artifact@v7
        with:
          name: wheels
          path: dist

      - name: Download binaries
        uses: actions/download-artifact@v7
        with:
          name: binaries
          path: dist/release-assets

      - name: Attach wheels and binaries to the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || github.ref_name }}
        run: |
          if ! gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release create "$TAG" --repo "${{ github.repository }}" --generate-notes
          fi
          gh release upload "$TAG" dist/*.whl dist/release-assets/* \
            --repo "${{ github.repository }}" --clobber

  testpypi:
    needs: [build, github-assets]
    if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - name: Download wheels
        uses: actions/download-artifact@v7
        with:
          name: wheels
          path: dist

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.13.8"
          enable-cache: false

      - name: Publish platform wheels to TestPyPI
        run: >
          uv publish
          --publish-url https://test.pypi.org/legacy/
          --check-url https://test.pypi.org/simple/
          --trusted-publishing always
          dist/*.whl

  pypi:
    needs: testpypi
    if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - name: Download wheels
        uses: actions/download-artifact@v7
        with:
          name: wheels
          path: dist

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.13.8"
          enable-cache: false

      - name: Publish platform wheels to PyPI
        run: >
          uv publish
          --check-url https://pypi.org/simple/
          --trusted-publishing always
          dist/*.whl
