# This workflow will install Python dependencies, run tests and lint with a single version of Python
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: CI

on:
  push:
    # Use ["main", "master"] for CI only on the default branch.
    # Use ["**"] for CI on all branches.
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

permissions:
  contents: read

jobs:
  # Tests need the host binaries. Compile them once per native-source change
  # and reuse the artifact. A full cross-compile belongs in native.yml and
  # publish.yml, not on every push.
  native:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.13.8"
          enable-cache: true
          python-version: "3.13"

      - name: Restore host binaries
        id: host-bin
        uses: actions/cache@v4
        with:
          path: dist/bin
          key: host-bin-zig-0.17.1-${{ hashFiles('native/**', 'scripts/build_native.py', 'scripts/native_meta.py') }}

      - name: Install Zig
        if: steps.host-bin.outputs.cache-hit != 'true'
        uses: mlugg/setup-zig@v2.2.1
        with:
          version: "0.17.1"

      - name: Build host C tools
        if: steps.host-bin.outputs.cache-hit != 'true'
        run: python scripts/build_native.py

      - name: Upload host binaries
        uses: actions/upload-artifact@v7
        with:
          name: host-binaries
          path: dist/bin
          if-no-files-found: error

  build:
    needs: native
    strategy:
      matrix:
        os: ["ubuntu-latest"]
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15"]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout (official GitHub action)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install uv (official Astral action)
        uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.13.8"
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Download host binaries
        uses: actions/download-artifact@v7
        with:
          name: host-binaries
          path: dist/bin

      # Artifact zips do not keep the executable bit.
      - name: Mark host binaries executable
        run: chmod -R a+x dist/bin

      - name: Install all dependencies
        run: uv sync --locked

      - name: Run linting
        run: uv run python devtools/lint.py --check

      - name: Run tests with coverage
        run: >
          uv run pytest -n auto
          --cov
          --cov-report=term-missing
          --cov-report=xml

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: coverage-py${{ matrix.python-version }}
          path: coverage.xml
          if-no-files-found: error

      - name: Verify Docs Build
        run: uv run mkdocs build --strict

  # Full lint/test needs 3.11+. The launcher runs on 3.6+, but hatchling and
  # uv-dynamic-versioning need 3.10 to build. Build the wheel on 3.13 and
  # import that wheel on the oldest interpreters uv ships.
  launcher-old-python:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.8", "3.9", "3.10"]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.13.8"
          enable-cache: true
          python-version: "3.13"

      - name: Install old CPython
        run: uv python install ${{ matrix.python-version }}

      - name: Build the wheel
        run: uv build --wheel --python 3.13 --out-dir dist/old-python

      - name: Install the wheel
        env:
          # setup-uv pins UV_PYTHON to 3.13. This step installs into the
          # old interpreter, so override that pin for both commands.
          UV_PYTHON: ${{ matrix.python-version }}
        run: |
          uv venv
          uv pip install dist/old-python/*.whl

      - name: Import launcher
        run: |
          .venv/bin/python -c "from tools_shed.launch import exe_name, find_binary, host_triple; print(host_triple()); print(exe_name('sync_chosen_files')); print(find_binary('sync_chosen_files'))"
          .venv/bin/python -m tools_shed

  security:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.13.8"
          enable-cache: true
          python-version: "3.13"

      - name: Audit dependencies
        run: uv audit --locked --preview-features audit-command
