# This workflow will install Python dependencies, run tests and lint with a single version of Python
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: CI

on:
  push:
    # Use ["main", "master"] for CI only on the default branch.
    # Use ["**"] for CI on all branches.
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

permissions:
  contents: read

jobs:
  build:
    strategy:
      matrix:
        os: ["ubuntu-latest"]
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15"]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout (official GitHub action)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install uv (official Astral action)
        uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.13.8"
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Install Zig
        uses: mlugg/setup-zig@v2.2.1
        with:
          version: "0.17.1"

      - name: Install all dependencies
        run: uv sync --locked

      - name: Build host C tools
        run: uv run python scripts/build_native.py

      - name: Run linting
        run: uv run python devtools/lint.py --check

      - name: Run tests with coverage
        run: >
          uv run pytest -n auto
          --cov
          --cov-report=term-missing
          --cov-report=xml

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: coverage-py${{ matrix.python-version }}
          path: coverage.xml
          if-no-files-found: error

      - name: Verify Docs Build
        run: uv run mkdocs build --strict

  # Full lint/test needs 3.11+ (ruff, ty, pytest). The published launcher is
  # written for Python 3.6+; smoke-import it on the oldest CPython uv ships.
  launcher-old-python:
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.8", "3.9", "3.10"]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.13.8"
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Install the package only
        run: uv pip install .

      - name: Import launcher
        run: |
          python -c "from uv_scripts.launch import exe_name, find_binary, host_triple; print(host_triple()); print(exe_name('sync_chosen_files')); print(find_binary('sync_chosen_files'))"
          python -m uv_scripts

  cross-compile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.13.8"
          enable-cache: true
          python-version: "3.13"

      - name: Install Zig
        uses: mlugg/setup-zig@v2.2.1
        with:
          version: "0.17.1"

      - name: Install all dependencies
        run: uv sync --locked

      - name: Build every target
        run: uv run python scripts/build_native.py --all

      - name: Package platform wheels
        run: uv run python scripts/package_wheels.py --assets-dir dist/release-assets

      - name: Upload binaries
        uses: actions/upload-artifact@v7
        with:
          name: native-binaries
          path: dist/bin
          if-no-files-found: error

      - name: Upload wheels
        uses: actions/upload-artifact@v7
        with:
          name: platform-wheels
          path: dist/*.whl
          if-no-files-found: error

  security:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          version: "0.13.8"
          enable-cache: true
          python-version: "3.13"

      - name: Audit dependencies
        run: uv audit --locked --preview-features audit-command
